name: Formal checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  finite-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out pinned source ledgers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: prx0r/translation-work
          # Keep in sync with formal-trika/bridge/passages.snapshot.json.
          ref: 79a474b0f0f12e668cf9894c2fc229173e466969
          path: translation-work
          sparse-checkout: |
            paramarthasara
            phrdaya
            source-maps
            spanda
            tantraloka-a15
            tantraloka-a34
            tantrasara-a01
            tantrasara-a02
            tantrasara-a03
            tantrasara-a04
            tantrasara-a05
            tantrasara-a06
            tantrasara-a07
            tantrasara-a08
            tantrasara-a09
            tantrasara-a10
            tantrasara-a11
            tantrasara-a12
            tantrasara-a13
            tantrasara-a14
            tantrasara-a15
            tantrasara-a16
            tantrasara-a17
            tantrasara-a18
            tantrasara-a19
            tantrasara-a20
            tantrasara-a21
            tantrasara-a22
            vbt
      - name: Install pinned Lean release
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst
          echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Check out pinned Scholar claims code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: prx0r/svread
          ref: f646a66f443132383e6e149cb264bf2031d3b00c
          path: svread
          sparse-checkout: mcp
      - name: Python evidence-boundary tests
        env:
          SVREAD_CHECKOUT: ${{ github.workspace }}/svread
        run: python3 -m unittest discover -s formal-trika/tests -v
      - name: Lean axiom hygiene (static; no toolchain needed)
        run: python3 formal-trika/tools/axiom_audit.py --check
      - name: Check theorem review-status inventory
        run: python3 formal-trika/tools/review_status.py --check
      - name: Generated-artifact freshness
        run: |
          python3 formal-trika/tools/vocab.py --check
          python3 formal-trika/tools/table.py --check
          python3 formal-trika/tools/runs-index.py --check
          python3 formal-trika/tools/blind.py --check
      - name: Control and recognition models
        run: |
          sh formal-trika/control/run.sh
          sh formal-trika/recognition/run.sh
      - name: Co-occurrence pilot (vendored decodes)
        run: python3 formal-trika/tools/tc1_cooccurrence.py
      - name: Source bridge, evidence coverage and Treeka gap report
        run: |
          python3 formal-trika/tools/bridge_resolve.py --check --tw translation-work
          python3 formal-trika/tools/evidence_check.py --root translation-work
          python3 formal-trika/tools/treeka_formal.py --tw translation-work
          python3 formal-trika/tools/compose_bridge.py --tw translation-work --out "$RUNNER_TEMP/composition.json"
          python3 formal-trika/tools/map_agreement.py --tw translation-work --out "$RUNNER_TEMP/agreement.json"
