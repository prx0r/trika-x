name: Formal checks

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  finite-models:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Lean release
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/lean.tar.zst" \
            https://github.com/leanprover/lean4/releases/download/v4.34.1/lean-4.34.1-linux.tar.zst
          echo "47bf4bbd78f70c2e9670598ab7124d92b6efb7330ff33e5fbb4030f6fd72e4e4  $RUNNER_TEMP/lean.tar.zst" | sha256sum -c -
          tar --zstd -xf "$RUNNER_TEMP/lean.tar.zst" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/lean-4.34.1-linux/bin" >> "$GITHUB_PATH"
      - name: Python evidence-boundary tests
        run: python3 -m unittest discover -s formal-trika/tests -v
      - name: Generated-artifact freshness
        run: |
          python3 formal-trika/tools/vocab.py --check
          python3 formal-trika/tools/table.py --check
      - name: Control and recognition models
        run: |
          sh formal-trika/control/run.sh
          sh formal-trika/recognition/run.sh
      - name: Co-occurrence pilot (vendored decodes)
        run: python3 formal-trika/tools/tc1_cooccurrence.py
      - name: Openpatala bridge map check (self-contained)
        run: python3 formal-trika/tools/bridge_resolve.py --check
